<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Ledger</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1f5f4a">
<link rel="stylesheet" href="styles.css">
</head>
<body class="no-book">
<header id="toolbar">
  <button id="btn-menu" class="icon" title="Menu" aria-label="Menu">&#9776;</button>
  <div class="brand">
    <span id="book-title">Simple Ledger</span>
    <span id="dirty" class="dot" title="Saved"></span>
    <small id="file-name"></small>
  </div>
  <div class="tools">
    <button id="btn-add" class="primary" title="Add a transaction in plain words" disabled>+ Add</button>
    <button id="btn-new" title="New book">New</button>
    <button id="btn-open" title="Open a journal file">Open</button>
    <button id="btn-save" class="primary" title="Save (Ctrl+S)">Save</button>
    <button id="btn-saveas" title="Save as a new file (Ctrl+Shift+S)">Save As</button>
    <button id="btn-close" title="Close this book">Close</button>
    <button id="btn-help" title="Open the Help guide in a new tab">Help</button>
  </div>
</header>
<div id="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script src="js/money.js"></script>
<script src="js/journal.js"></script>
<script src="js/book.js"></script>
<script src="js/templates.js"></script>
<script src="js/reports.js"></script>
<script src="js/biz.js"></script>
<script src="js/import.js"></script>
<script src="js/pocket.js"></script>
<script src="js/merge.js"></script>
<script src="js/reconcile.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/reportui.js"></script>
<script src="js/importui.js"></script>
<script src="js/reconcileui.js"></script>
<script src="js/checks.js"></script>
<script src="js/flow.js"></script>
<script src="js/demo.js"></script>
<script src="js/diagnose.js"></script>
<script src="js/ai.js"></script>
<script src="js/aiui.js"></script>
<script src="js/bizui.js"></script>
<script src="js/checksui.js"></script>
<script src="js/quickui.js"></script>
<script src="js/pocketui.js"></script>
<script src="js/mergeui.js"></script>
<script src="js/helpcontent.js"></script>
<script src="js/home.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
