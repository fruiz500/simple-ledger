<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket">
<title>Simple Ledger Pocket</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { --accent: #1f5f4a; --accent-ink: #fff; --ink: #1d2430; --quiet: #6b7480; --line: #dde2e8; --bg: #f4f6f8; --panel: #fff; --neg: #b3261e; --pos: #1d7a46; --warn: #8a5a00; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
header { background: var(--accent); color: var(--accent-ink); padding: 12px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header small { display: block; font-weight: 400; opacity: .85; font-size: 13px; }
header button { background: transparent; border: 1px solid rgba(255,255,255,.5); color: #fff; padding: 6px 10px; }
main { padding: 14px 14px 110px; max-width: 560px; margin: 0 auto; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.danger { color: var(--neg); }
button.link { border: none; background: none; color: var(--accent); padding: 6px 4px; }
button:disabled { opacity: .45; }
.big2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 4px 0 18px; }
.big2 button { padding: 22px 8px; font-size: 20px; font-weight: 600; border-radius: 14px; }
.big2 .spent { background: #fff3f2; border-color: #f0c9c6; color: var(--neg); }
.big2 .got { background: #eef8f2; border-color: #bfe3cd; color: var(--pos); }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--quiet); margin: 18px 2px 8px; font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: flex; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); align-items: center; }
.row:first-child { border-top: none; }
.row.click { cursor: pointer; } .row.click:active { background: #f0f3f6; }
.row .main { flex: 1; min-width: 0; }
.row .main strong, .row .main small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .main small { color: var(--quiet); font-size: 14px; }
.amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.amt.neg { color: var(--neg); } .amt.pos { color: var(--pos); }
.empty { color: var(--quiet); padding: 14px; text-align: center; }
.sendbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: rgba(244,246,248,.96); border-top: 1px solid var(--line); }
.sendbar button { width: 100%; max-width: 560px; display: block; margin: 0 auto; padding: 15px; font-size: 18px; }
form { display: grid; gap: 14px; }
label.f { display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; font-size: 15px; color: var(--quiet); }
label.f input, label.f select, label.f textarea { font: inherit; font-size: 18px; color: var(--ink); padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); width: 100%; -webkit-appearance: none; appearance: none; }
label.f select { background-image: linear-gradient(45deg, transparent 50%, var(--quiet) 50%), linear-gradient(135deg, var(--quiet) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
label.f input.money { font-size: 30px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: none; border-radius: 0; padding: 12px; background: var(--panel); }
.seg button.on.spent { background: var(--neg); color: #fff; } .seg button.on.got { background: var(--pos); color: #fff; }
.actions { display: flex; gap: 10px; } .actions .grow { flex: 1; }
.note { color: var(--quiet); font-size: 14px; }
.warn { color: var(--warn); font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom)); background: #1d2430; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 15px; z-index: 9; max-width: 90vw; }
.welcome { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.welcome ol { padding-left: 20px; } .welcome li { margin: 6px 0; }
.total { display: flex; justify-content: space-between; padding: 4px 4px 0; color: var(--quiet); font-size: 14px; }
kbd { font: inherit; }
.amtbox input.money { padding-right: 12px; }
.fx { background: #fbf6e8; border: 1px solid #ecdca6; border-radius: 10px; padding: 12px; display: grid; gap: 12px; } .fx[hidden] { display: none; } .fx .note { margin: 0; }
.orig { display: block; font-weight: 400; color: var(--quiet); font-size: 13px; text-align: right; }
</style>
</head>
<body>
<header>
  <h1 id="title">Simple Ledger Pocket</h1>
  <button id="btn-menu" hidden>Menu</button>
</header>
<main id="main"></main>
<div class="sendbar" id="sendbar" hidden><button class="primary" id="btn-send">Send to bookkeeper</button></div>
<script src="pocket.js"></script>
</body>
</html>
